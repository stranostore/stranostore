<script>
        // Credenziali Amministratore impostate
        const ADMIN_USER = "ciccioibra";
        const ADMIN_PASS = "ciccioibra142";

        // Prodotti di base con link dimostrativi
        const catalogoDefault = [
            { 
                id: 1, 
                nome: "Tazza autoriscaldante USB", 
                categoria: "Tech", 
                prezzo: 24.99, 
                mediaType: "image", 
                mediaSrc: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=80", 
                desc: "Mantiene il caffè caldo mentre lavori al PC.",
                subitoUrl: "https://www.subito.it",
                vintedUrl: "https://www.vinted.it"
            },
            { 
                id: 2, 
                nome: "Cuscino Fetta di Pizza", 
                categoria: "Casa", 
                prezzo: 19.99, 
                mediaType: "image", 
                mediaSrc: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&auto=format&fit=crop&q=80", 
                desc: "Ultra soffice, imbottito e realistico.",
                subitoUrl: "",
                vintedUrl: "https://www.vinted.it"
            },
            { 
                id: 3, 
                nome: "Lampada Levitante Magnetica", 
                categoria: "Tech", 
                prezzo: 49.99, 
                mediaType: "image", 
                mediaSrc: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500&auto=format&fit=crop&q=80", 
                desc: "Fluttua a mezz'aria senza fili a vista.",
                subitoUrl: "https://www.subito.it",
                vintedUrl: ""
            }
        ];

        let catalogo = JSON.parse(localStorage.getItem('stranostore_prodotti')) || catalogoDefault;
        let carrello = JSON.parse(localStorage.getItem('stranostore_carrello')) || [];
        let isAdmin = sessionStorage.getItem('stranostore_admin') === 'true';

        let mediaCaricato = null;

        function init() {
            aggiornaStatoAdminUI();
            mostraProdotti(catalogo);
            aggiornaCarrelloUI();
        }

        // GESTIONE LOGIN ADMIN
        function apriModalLogin() {
            if (isAdmin) {
                apriModalCreaArticolo();
            } else {
                document.getElementById('modal-login').classList.remove('hidden');
            }
        }

        function chiudiModalLogin() {
            document.getElementById('modal-login').classList.add('hidden');
            document.getElementById('login-error').classList.add('hidden');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            // Normalizzazione: rimuove spazi e gestisce minuscole per evitare errori di battitura
            const inputUser = document.getElementById('admin-user').value.replace(/\s+/g, '').toLowerCase();
            const inputPass = document.getElementById('admin-pass').value.replace(/\s+/g, '').toLowerCase();

            if (inputUser === ADMIN_USER && inputPass === ADMIN_PASS) {
                isAdmin = true;
                sessionStorage.setItem('stranostore_admin', 'true');
                chiudiModalLogin();
                aggiornaStatoAdminUI();
                mostraToast("Accesso Amministratore effettuato!");
                mostraProdotti(catalogo);
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            sessionStorage.removeItem('stranostore_admin');
            aggiornaStatoAdminUI();
            mostraToast("Logout effettuato");
            mostraProdotti(catalogo);
        }

        function aggiornaStatoAdminUI() {
            const adminBar = document.getElementById('admin-bar');
            const quickAdd = document.getElementById('admin-quick-add');
            const loginTrigger = document.getElementById('btn-login-trigger');

            if (isAdmin) {
                adminBar.classList.remove('hidden');
                quickAdd.classList.remove('hidden');
                loginTrigger.innerHTML = '<i class="fa-solid fa-gear text-amber-600"></i>';
                loginTrigger.title = "Pannello Admin Attivo";
            } else {
                adminBar.classList.add('hidden');
                quickAdd.classList.add('hidden');
                loginTrigger.innerHTML = '<i class="fa-solid fa-lock text-sm"></i>';
                loginTrigger.title = "Accesso Amministratore";
            }
        }

        // MODALE CREAZIONE ANNUNCI
        function apriModalCreaArticolo() {
            document.getElementById('modal-crea').classList.remove('hidden');
        }

        function chiudiModalCreaArticolo() {
            document.getElementById('modal-crea').classList.add('hidden');
            mediaCaricato = null;
            document.getElementById('anteprima-container').classList.add('hidden');
            document.getElementById('anteprima-output').innerHTML = '';
        }

        function anteprimaMedia(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const isVideo = file.type.startsWith('video');

            reader.onload = function(evt) {
                mediaCaricato = {
                    type: isVideo ? 'video' : 'image',
                    src: evt.target.result
                };

                const output = document.getElementById('anteprima-output');
                document.getElementById('anteprima-container').classList.remove('hidden');

                if (isVideo) {
                    output.innerHTML = `<video src="${mediaCaricato.src}" controls class="h-full w-full object-cover"></video>`;
                } else {
                    output.innerHTML = `<img src="${mediaCaricato.src}" class="h-full w-full object-cover">`;
                }
            };

            reader.readAsDataURL(file);
        }

        function handleCreaArticolo(e) {
            e.preventDefault();

            const nome = document.getElementById('nuovo-nome').value.trim();
            const categoria = document.getElementById('nuovo-categoria').value;
            const prezzo = parseFloat(document.getElementById('nuovo-prezzo').value);
            const desc = document.getElementById('nuovo-desc').value.trim();
            const urlManuale = document.getElementById('nuovo-url').value.trim();
            const subitoUrl = document.getElementById('nuovo-subito').value.trim();
            const vintedUrl = document.getElementById('nuovo-vinted').value.trim();

            let mediaFinal = {
                type: 'image',
                src: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'
            };

            if (mediaCaricato) {
                mediaFinal = mediaCaricato;
            } else if (urlManuale) {
                const isVideo = urlManuale.endsWith('.mp4') || urlManuale.endsWith('.webm');
                mediaFinal = {
                    type: isVideo ? 'video' : 'image',
                    src: urlManuale
                };
            }

            const nuovoArticolo = {
                id: Date.now(),
                nome: nome,
                categoria: categoria,
                prezzo: prezzo,
                mediaType: mediaFinal.type,
                mediaSrc: mediaFinal.src,
                desc: desc,
                subitoUrl: subitoUrl,
                vintedUrl: vintedUrl
            };

            catalogo.unshift(nuovoArticolo);
            localStorage.setItem('stranostore_prodotti', JSON.stringify(catalogo));

            chiudiModalCreaArticolo();
            mostraProdotti(catalogo);
            mostraToast("Articolo pubblicato con successo!");
            e.target.reset();
        }

        function eliminaArticolo(id) {
            if (confirm("Vuoi davvero eliminare questo annuncio dallo store?")) {
                catalogo = catalogo.filter(p => p.id !== id);
                localStorage.setItem('stranostore_prodotti', JSON.stringify(catalogo));
                mostraProdotti(catalogo);
                mostraToast("Articolo eliminato.");
            }
        }

        // VISUALIZZAZIONE PRODOTTI CON TASTI SUBITO E VINTED
        function mostraProdotti(lista) {
            const griglia = document.getElementById('griglia-prodotti');
            if (lista.length === 0) {
                griglia.innerHTML = `<p class="col-span-full text-center text-slate-400 py-12">Nessun articolo presente in questa sezione.</p>`;
                return;
            }

            griglia.innerHTML = lista.map(p => {
                let mediaHtml = '';
                if (p.mediaType === 'video') {
                    mediaHtml = `
                        <video controls class="w-full h-full object-cover">
                            <source src="${p.mediaSrc}">
                        </video>
                    `;
                } else {
                    mediaHtml = `<img src="${p.mediaSrc}" alt="${p.nome}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">`;
                }

                const adminToolsHtml = isAdmin ? `
                    <div class="absolute top-3 right-3 z-10">
                        <button onclick="eliminaArticolo(${p.id})" title="Rimuovi Articolo" class="w-8 h-8 rounded-full bg-rose-600 text-white flex items-center justify-center hover:bg-rose-700 shadow-lg cursor-pointer">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                ` : '';

                let piattaformeHtml = '';
                if (p.subitoUrl || p.vintedUrl) {
                    piattaformeHtml = `<div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap gap-2 items-center">
                        <span class="text-[11px] font-bold text-slate-400 w-full">Oppure compra su:</span>`;
                    
                    if (p.subitoUrl) {
                        piattaformeHtml += `
                            <a href="${p.subitoUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 py-1.5 px-2.5 rounded-lg bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Subito
                            </a>
                        `;
                    }
                    if (p.vintedUrl) {
                        piattaformeHtml += `
                            <a href="${p.vintedUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 py-1.5 px-2.5 rounded-lg bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> Vinted
                            </a>
                        `;
                    }
                    piattaformeHtml += `</div>`;
                }

                return `
                    <div class="relative bg-white rounded-3xl p-5 border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                        ${adminToolsHtml}
                        <div>
                            <div class="w-full h-52 bg-slate-100 rounded-2xl overflow-hidden mb-4 relative">
                                ${mediaHtml}
                            </div>
                            <span class="text-xs font-bold px-2.5 py-1 bg-slate-100 text-indigo-600 rounded-md uppercase tracking-wider">${p.categoria}</span>
                            <h3 class="text-lg font-bold text-slate-900 mt-2">${p.nome}</h3>
                            <p class="text-sm text-slate-500 mt-1 line-clamp-2">${p.desc}</p>
                        </div>
                        <div>
                            <div class="mt-6 flex items-center justify-between pt-4 border-t border-slate-100">
                                <span class="text-xl font-black text-slate-900">€ ${p.prezzo.toFixed(2)}</span>
                                <button onclick="aggiungiAlCarrello(${p.id})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold transition cursor-pointer">
                                    Aggiungi al carrello
                                </button>
                            </div>
                            ${piattaformeHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filtraProdotti(categoria) {
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.className = "filtro-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition cursor-pointer";
            });
            event.target.className = "filtro-btn active px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white transition cursor-pointer";

            if (categoria === 'tutti') {
                mostraProdotti(catalogo);
            } else {
                mostraProdotti(catalogo.filter(p => p.categoria === categoria));
            }
        }

        // CARRELLO E CHECKOUT
        function toggleCart() {
            document.getElementById('cart-drawer').classList.toggle('hidden');
        }

        function aggiungiAlCarrello(id) {
            const itemCatalogo = catalogo.find(p => p.id === id);
            if (!itemCatalogo) return;

            const esistente = carrello.find(i => i.id === id);
            if (esistente) {
                esistente.qta += 1;
            } else {
                carrello.push({
                    id: itemCatalogo.id,
                    nome: itemCatalogo.nome,
                    prezzo: itemCatalogo.prezzo,
                    mediaSrc: itemCatalogo.mediaSrc,
                    qta: 1
                });
            }
            salvaCarrello();
            mostraToast(`${itemCatalogo.nome} aggiunto al carrello!`);
        }

        function salvaCarrello() {
            localStorage.setItem('stranostore_carrello', JSON.stringify(carrello));
            aggiornaCarrelloUI();
        }

        function aggiornaCarrelloUI() {
            const container = document.getElementById('cart-items');
            const badge = document.getElementById('cart-badge');
            const totalEl = document.getElementById('cart-total');

            const totaleQta = carrello.reduce((acc, i) => acc + i.qta, 0);
            const prezzoTotale = carrello.reduce((acc, i) => acc + (i.prezzo * i.qta), 0);

            badge.textContent = totaleQta;
            badge.classList.toggle('hidden', totaleQta === 0);

            if (carrello.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-12">Il carrello è vuoto.</p>';
            } else {
                container.innerHTML = carrello.map(item => `
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-2xl">
                        <div class="w-12 h-12 rounded-xl bg-slate-200 overflow-hidden flex items-center justify-center">
                            <img src="${item.mediaSrc}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200'">
                        </div>
                        <div class="flex-1 mx-3">
                            <h4 class="font-bold text-xs text-slate-900 leading-tight">${item.nome}</h4>
                            <p class="text-xs text-slate-500">€ ${item.prezzo.toFixed(2)} x ${item.qta}</p>
                        </div>
                        <button onclick="rimuoviDalCarrello(${item.id})" class="text-slate-400 hover:text-rose-500 p-2 cursor-pointer">
                            <i class="fa-solid fa-trash text-sm"></i>
                        </button>
                    </div>
                `).join('');
            }
            totalEl.textContent = `€ ${prezzoTotale.toFixed(2)}`;
        }

        function rimuoviDalCarrello(id) {
            carrello = carrello.filter(i => i.id !== id);
            salvaCarrello();
        }

        function checkoutPayPal() {
            if (carrello.length === 0) {
                alert("Il carrello è vuoto!");
                return;
            }
            const totale = carrello.reduce((acc, i) => acc + (i.prezzo * i.qta), 0);
            window.open(`https://paypal.me/frastrano/${totale.toFixed(2)}EUR`, '_blank');
        }

        function mostraToast(testo) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = testo;
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 2500);
        }

        window.onload = init;
    </script>
